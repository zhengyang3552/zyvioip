name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布 Release（勾选后才会创建 GitHub Release 并上传 APK）'
        type: boolean
        default: false
      tag:
        description: '要发布的 tag（例如 v0.0.8）。留空则使用当前分支最新 commit 打 tag'
        type: string
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  # 版本号注入：debug / release 读到同一组值，versionCode 随 run_number 单调递增。
  BUILD_NUMBER: ${{ github.run_number }}
  # 版本名来源优先级：
  #   1. 手动发布时填写的 tag 输入
  #   2. tag 推送时的 ref_name
  #   3. 空 -> 回退 build.gradle.kts 里的默认值
  VERSION_NAME: >-
    ${{ inputs.tag != '' && inputs.tag
        || (startsWith(github.ref, 'refs/tags/v') && github.ref_name)
        || '' }}
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
    -Dkotlin.daemon.jvm.options=-Xmx1536m
    -Dorg.gradle.internal.http.connectionTimeout=60000
    -Dorg.gradle.internal.http.socketTimeout=60000
    -Dorg.gradle.internal.repository.max.retries=8
    -Dorg.gradle.internal.repository.initial.backoff=3000

jobs:
  # 普通分支/PR：单元测试 + Debug 构建
  build:
    name: 单元测试 / 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          else
            echo "sdkmanager not found; using preinstalled SDK"
          fi

      - name: 还原固定签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，Debug 包将使用随机调试签名（无法覆盖安装正式版）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PATH=app/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 单元测试
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 写入构建摘要
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "### Debug APK"
            echo "- 产物：\`$APK\`"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zyvioip-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyvioip-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint 检查
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      - name: 运行 Lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyvioip-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  # 发布是**手动**动作：只有 workflow_dispatch 且勾选 publish 时才跑。
  # 推 tag 不再自动发版 —— tag 只用于标记代码节点与跑质量门。
  release:
    name: 发布 Release APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      - name: 还原固定签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::未配置 KEYSTORE_BASE64 等 Secret，无法产出签名固定的 Release 包（见 docs/SIGNING.md）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PATH=app/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 构建 Release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # 关键校验：必须同时通过 v1 / v2 / v3。
      # 历史上这个项目只签了 v2，MIUI/HyperOS、ColorOS 等国产 ROM 的安装器会读 v1 签名，
      # 结果报“解析软件包时出现问题 / 无效的安装包”。这里把校验做成硬失败，
      # 以后再出现只有 v2 的产物，CI 直接挂掉，不会把坏包发出去。
      - name: 校验签名方案与指纹
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          test -n "$APK" || { echo "::error::未找到 Release APK"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)

          # 注意：直接用 apksigner verify 时，若 APK 的 minSdk >= 24，
          # apksigner 会把 v1 标成 "false"，因为该方案对 minSdk>=24 不是必需的 —— 
          # 这不代表 v1 没签上。要验证 v1 是否真的有效，必须把 min-sdk 压到 24 以下。
          "$APKSIGNER" verify --min-sdk-version 21 --verbose --print-certs "$APK" > certs.txt
          cat certs.txt

          V1=$(grep -c "Verified using v1 scheme (JAR signing): true" certs.txt || true)
          V2=$(grep -c "Verified using v2 scheme (APK Signature Scheme v2): true" certs.txt || true)
          V3=$(grep -c "Verified using v3 scheme (APK Signature Scheme v3): true" certs.txt || true)
          if [ "$V1" -lt 1 ] || [ "$V2" -lt 1 ]; then
            echo "::error::签名方案不完整（需要 v1+v2，实际 v1=$V1 v2=$V2），这类包在国产 ROM 上会安装失败"
            exit 1
          fi
          if [ "$V3" -lt 1 ]; then
            echo "::error::缺少 v3 签名方案，检查 enableV3Signing"
            exit 1
          fi
          # 再从 ZIP 层面复核 v1 的三个签名文件确实存在（防止 enableV1Signing 被误关）
          python3 -c "
          import sys, zipfile
          names = set(zipfile.ZipFile('$APK').namelist())
          need = ('META-INF/MANIFEST.MF', 'META-INF/CERT.SF', 'META-INF/CERT.RSA')
          missing = [f for f in need if f not in names]
          if missing:
              print('::error::缺少 v1 签名文件 ' + str(missing) + '，国产 ROM 会报「解析软件包时出现问题」')
              sys.exit(1)
          print('v1 签名文件齐全：MANIFEST.MF / CERT.SF / CERT.RSA')
          "

          SHA256=$(grep -oE 'SHA-256 digest: .*' certs.txt | head -1 | cut -d' ' -f3-)
          EXPECTED="52c76737d22aa3e7f2bf1ac98e9fdb5fd4776034612264e683213c44d270a1b4"
          ACTUAL=$(echo "$SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹不匹配！期望 $EXPECTED，实际 $ACTUAL（Secrets 里的 keystore 可能不对）"
            exit 1
          fi
          {
            echo "### 签名校验"
            echo '```'
            echo "v1 (JAR)  : OK"
            echo "v2        : OK"
            echo "v3        : $( [ "$V3" -ge 1 ] && echo OK || echo 缺失 )"
            echo "SHA-256   : $SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 校验 lifecycle 版本：2.8.x 与 compose-ui 1.6.8 不匹配，会启动即崩
      - name: 校验 lifecycle 依赖版本
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          python3 -c "
          import sys, zipfile, re
          z = zipfile.ZipFile('$APK')
          bad = []
          for n in z.namelist():
              if n.startswith('META-INF/androidx.lifecycle_') and n.endswith('.version'):
                  v = z.read(n).decode(errors='ignore').strip()
                  print('  ' + n.split('androidx.lifecycle_')[-1].replace('.version','') + ' = ' + v)
                  if re.match(r'^2\.[89]\.|^3\.', v):
                      bad.append((n, v))
          if bad:
              print('::error::lifecycle 版本过高，会因 LocalLifecycleOwner 缺失而启动崩溃')
              sys.exit(1)
          print('lifecycle 版本校验通过')
          "

      # 用 zipalign 复核对齐，避免“能装但启动即崩”的隐性问题
      - name: 校验 APK 对齐
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -1)
          "$ZIPALIGN" -c -v 4 "$APK" > /dev/null && echo "zipalign 4-byte 对齐通过"

      - name: 重命名 APK 并创建 Release
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          # 只产出一个 APK。
          # 版本号取自 VERSION_NAME（已在 workflow env 里统一解析：
          # 手动发布用 inputs.tag，tag 推送用 ref_name，都没有则回退）。
          # 注意不能直接用 GITHUB_REF_NAME：手动发布时它是分支名（main），不适合当版本。
          VERSION="${VERSION_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::无法确定版本号：请在触发时填写 tag 输入"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp "$APK" "dist/zyvioip-${VERSION}.apk"
          ls -lh dist/
          test "$(find dist -name '*.apk' | wc -l)" -eq 1 || { echo "::error::dist 里应只有 1 个 APK"; exit 1; }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动发布时没有 ref 上的 tag 上下文，必须显式指定；
          # 若该 tag 尚不存在，action 会基于当前 commit 自动创建。
          tag_name: ${{ env.VERSION_NAME }}
          name: ${{ env.VERSION_NAME }}
          files: dist/*.apk
          generate_release_notes: true

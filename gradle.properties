android.useAndroidX=true
android.enableJetifier=true
# Compose compiler 1.5.14 defaults to requiring Kotlin 1.9.24; project pins Kotlin 1.9.23.
android.suppressKotlinVersionCompatibilityCheck=true
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=3000
